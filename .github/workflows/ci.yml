name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run integration tests
        run: npm run test:integration

      - name: Verify package contents
        run: npm run pack:dry-run

  runtime-compatibility:
    name: Node.js 24 build on Node.js ${{ matrix.runtime-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Node.js 24
        run: npm run build

      - name: Set up runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime-version }}
          cache: npm

      - name: Run integration tests
        run: npm run test:integration